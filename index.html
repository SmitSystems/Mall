<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Malla · Chat híbrido</title>
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#075e54">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f5f7;--surf:#fff;--tx:#14171c;--mut:#667085;--bd:#e2e5ea;--acc:#0b6bcb;--bt:#6d3fc9;--ok:#1a7f4b;--out:#dbeafe;--inn:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1216;--surf:#181c22;--tx:#eef1f5;--mut:#98a2b3;--bd:#2a313b;--acc:#5aa9ff;--bt:#b794ff;--ok:#4cc38a;--out:#173250;--inn:#1e242c}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1216;--surf:#181c22;--tx:#eef1f5;--mut:#98a2b3;--bd:#2a313b;--acc:#5aa9ff;--bt:#b794ff;--ok:#4cc38a;--out:#173250;--inn:#1e242c}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:10px 14px;background:var(--surf);border-bottom:1px solid var(--bd)}
h1{font-size:17px;margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--bd);font-weight:600}
.chip.net{color:var(--acc)}.chip.bt{color:var(--bt)}.chip.off{color:var(--mut)}
.bar{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
button,select{font:inherit;color:var(--tx);background:var(--surf);border:1px solid var(--bd);border-radius:10px;padding:7px 11px;cursor:pointer}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
#log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:88%;padding:8px 11px;border-radius:14px;background:var(--inn);border:1px solid var(--bd)}
.m.me{align-self:flex-end;background:var(--out)}
.m.sys{align-self:center;background:none;border:none;color:var(--mut);font-size:13px;text-align:center}
.meta{font-size:11px;color:var(--mut);margin-top:3px}
.m img{max-width:100%;border-radius:10px;display:block}
canvas{width:100%;max-width:320px;border-radius:8px;border:1px solid var(--bd);display:block;margin-top:6px}
a{color:var(--acc)}
form{display:flex;gap:6px;padding:10px;background:var(--surf);border-top:1px solid var(--bd)}
input[type=text]{flex:1;min-width:0;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 11px}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--surf);color:var(--tx);max-width:420px;width:92%}
dialog li{margin:6px 0}
</style>
</head>
<body>
<header>
  <h1>Malla <span id="chip" class="chip">…</span></h1>
  <div class="bar">
    <select id="mode" aria-label="Modo">
      <option value="auto">Auto (Internet → Bluetooth)</option>
      <option value="net">Solo Internet</option>
      <option value="bt">Solo Bluetooth</option>
    </select>
    <button id="test">🧪 Probar</button>
    <button id="loc">📍 Ubicación en vivo</button>
  </div>
</header>
<div id="log"></div>
<form id="f">
  <button type="button" id="imgb" title="Enviar imagen">🖼️</button>
  <input type="file" id="file" accept="image/*" hidden>
  <input type="text" id="txt" placeholder="Escribe un mensaje…" autocomplete="off">
  <button class="pri">Enviar</button>
</form>
<dialog id="dlg"><b>Prueba de conexión</b><ul id="res"></ul><button id="close">Cerrar</button></dialog>

<script>
const $=s=>document.querySelector(s), log=$('#log');
let watchId=null, locMsg=null;

function transport(){
  const m=$('#mode').value;
  if(m==='net')return navigator.onLine?'net':'off';
  if(m==='bt')return 'bt';
  return navigator.onLine?'net':'bt';
}
function refresh(){
  const t=transport(), c=$('#chip');
  c.className='chip '+t;
  c.textContent=t==='net'?'🌐 Internet':t==='bt'?'📶 Bluetooth (malla)':'Sin conexión';
}
addEventListener('online',()=>{refresh();sys('Volvió Internet: se usa la red global.')});
addEventListener('offline',()=>{refresh();sys('Sin Internet: se usa la malla Bluetooth.')});
$('#mode').onchange=refresh;

function sys(t){const d=document.createElement('div');d.className='m sys';d.textContent=t;log.append(d);log.scrollTop=log.scrollHeight}
function badge(t,extra=''){const h=Math.floor(Math.random()*3)+1;return (t==='net'?'🌐 Internet':t==='bt'?'📶 Bluetooth · '+h+(h>1?' saltos':' salto'):'⚠️ sin ruta')+extra}
function bubble(me,node,t,extra){
  const d=document.createElement('div');d.className='m'+(me?' me':'');
  d.append(node);
  const m=document.createElement('div');m.className='meta';
  m.textContent=(me?'Tú':'Nodo cercano (simulado)')+' · '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+' · '+badge(t,extra);
  d.append(m);log.append(d);log.scrollTop=log.scrollHeight;return d;
}
function txtNode(s){const p=document.createElement('div');p.textContent=s;return p}
function reply(t,what){
  if(t==='off')return;
  setTimeout(()=>bubble(false,txtNode('Recibí tu '+what+' ✔'),t),t==='bt'?1400:600);
}

$('#f').onsubmit=e=>{
  e.preventDefault();
  const v=$('#txt').value.trim();if(!v)return;
  const t=transport();
  if(t==='off'){sys('No hay ruta: cambia a Auto o Bluetooth.');return}
  bubble(true,txtNode(v),t);$('#txt').value='';reply(t,'mensaje');
};

$('#imgb').onclick=()=>$('#file').click();
$('#file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const t=transport();
  if(t==='off'){sys('No hay ruta disponible.');return}
  const max=t==='bt'?360:900, q=t==='bt'?0.5:0.8;
  const img=new Image(), url=URL.createObjectURL(f);
  img.onload=()=>{
    const k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const data=c.toDataURL('image/jpeg',q), kb=Math.round(data.length*0.75/1024);
    const el=new Image();el.src=data;el.alt='Imagen enviada';
    const frag=t==='bt'?' · '+Math.ceil(kb*1024/180)+' fragmentos BLE':'';
    bubble(true,el,t,' · '+kb+' KB'+frag);
    URL.revokeObjectURL(url);reply(t,'imagen');
  };
  img.src=url;e.target.value='';
};

function drawMap(cv,lat,lon){
  const x=cv.getContext('2d'),w=cv.width=320,h=cv.height=160;
  const cs=getComputedStyle(document.documentElement);
  x.fillStyle=cs.getPropertyValue('--bg');x.fillRect(0,0,w,h);
  x.strokeStyle=cs.getPropertyValue('--bd');x.lineWidth=1;
  for(let i=0;i<=12;i++){x.beginPath();x.moveTo(i*w/12,0);x.lineTo(i*w/12,h);x.stroke()}
  for(let j=0;j<=6;j++){x.beginPath();x.moveTo(0,j*h/6);x.lineTo(w,j*h/6);x.stroke()}
  const px=(lon+180)/360*w, py=(90-lat)/180*h;
  x.fillStyle='#e5484d';x.beginPath();x.arc(px,py,6,0,7);x.fill();
  x.strokeStyle='#e5484d';x.beginPath();x.arc(px,py,12,0,7);x.stroke();
}
function locUpdate(p){
  const {latitude:la,longitude:lo,accuracy:ac}=p.coords, t=transport();
  if(!locMsg){
    const box=document.createElement('div'), tx=document.createElement('div'), cv=document.createElement('canvas'), a=document.createElement('a');
    a.target='_blank';a.rel='noopener';a.textContent='Abrir en OpenStreetMap';
    box.append(tx,cv,a);box._p={tx,cv,a};
    locMsg=bubble(true,box,t,' · ubicación en vivo');locMsg._box=box;
  }
  const {tx,cv,a}=locMsg._box._p;
  tx.textContent='📍 '+la.toFixed(5)+', '+lo.toFixed(5)+' (±'+Math.round(ac)+' m)';
  a.href='https://www.openstreetmap.org/?mlat='+la+'&mlon='+lo+'#map=16/'+la+'/'+lo;
  drawMap(cv,la,lo);
}
$('#loc').onclick=()=>{
  const b=$('#loc');
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;locMsg=null;b.classList.remove('on');sys('Ubicación en vivo detenida.');return}
  if(!navigator.geolocation){sys('Este navegador no tiene geolocalización.');return}
  if(transport()==='off'){sys('No hay ruta para compartir ubicación.');return}
  watchId=navigator.geolocation.watchPosition(locUpdate,err=>{sys('No se pudo obtener la ubicación: '+err.message);navigator.geolocation.clearWatch(watchId);watchId=null;locMsg=null;b.classList.remove('on')},{enableHighAccuracy:true,maximumAge:2000});
  b.classList.add('on');sys('Ubicación en vivo activada. Se actualiza mientras te mueves.');
};

$('#test').onclick=async()=>{
  const r=$('#res');r.innerHTML='';
  const add=(ok,t)=>{const li=document.createElement('li');li.textContent=(ok?'✅ ':'❌ ')+t;r.append(li)};
  $('#dlg').showModal();
  add(navigator.onLine,'Internet: '+(navigator.onLine?'conectado':'sin conexión'));
  const t0=performance.now();await new Promise(s=>setTimeout(s,80));
  add(true,'Ciclo de envío/eco simulado: '+Math.round(performance.now()-t0)+' ms');
  add(!!navigator.geolocation,'Geolocalización disponible');
  try{
    if(navigator.permissions){const p=await navigator.permissions.query({name:'geolocation'});add(p.state!=='denied','Permiso de ubicación: '+p.state)}
  }catch(e){}
  const hasBT=!!navigator.bluetooth;
  add(hasBT,'Web Bluetooth: '+(hasBT?'disponible (solo escaneo/GATT cliente)':'no disponible en este navegador'));
  if(hasBT){
    const b=document.createElement('button');b.textContent='Buscar dispositivo Bluetooth';
    b.onclick=async()=>{try{const d=await navigator.bluetooth.requestDevice({acceptAllDevices:true});add(true,'Dispositivo: '+(d.name||d.id))}catch(e){add(false,'Búsqueda: '+e.message)}};
    r.append(b);
  }
  add(false,'Malla BLE real con saltos: requiere app nativa (aquí es simulada)');
};
$('#close').onclick=()=>$('#dlg').close();
refresh();
sys('Prototipo: el «nodo cercano» es simulado. Cambia el modo para ver Internet vs. Bluetooth.');
</script>
</body>
</html>
