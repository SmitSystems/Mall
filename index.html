<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--h1:#0a5f66;--h2:#0e8a8c;--bg:#e6eeea;--inn:#fff;--out:#d3f4ea;--tx:#111b21;--mut:#667781;--acc:#12a89a;--pill:#fff;--do:.3;--pop:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--h1:#0f2a30;--h2:#15393f;--bg:#0b141a;--inn:#1f2c34;--out:#0b5750;--tx:#e9edef;--mut:#8696a0;--acc:#1fc3b1;--pill:#1f2c34;--do:.16;--pop:#233138}}
:root[data-theme="dark"]{color-scheme:dark;--h1:#0f2a30;--h2:#15393f;--bg:#0b141a;--inn:#1f2c34;--out:#0b5750;--tx:#e9edef;--mut:#8696a0;--acc:#1fc3b1;--pill:#1f2c34;--do:.16;--pop:#233138}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:720px;margin-inline:auto;box-shadow:0 0 40px rgba(0,0,0,.15)}
.i{width:24px;height:24px;fill:currentColor;flex:none}
header{position:relative;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;color:#fff;background:linear-gradient(135deg,var(--h1),var(--h2));box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:5}
.av{width:42px;height:42px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.25),0 3px 8px rgba(0,0,0,.35)}
.ttl{flex:1;min-width:0;display:flex;flex-direction:column}.ttl b{font-size:17px;font-weight:600}.ttl small{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:none;border:0;color:inherit;padding:8px;border-radius:50%;cursor:pointer;display:grid;place-items:center}.ib:active,.ib.on{background:rgba(255,255,255,.22)}
#menu,#att{position:absolute;background:var(--pop);color:var(--tx);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.3);z-index:9}
#menu{right:8px;top:100%;padding:6px 0;min-width:230px}#menu button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:11px 18px;cursor:pointer}
#menu button.sel{color:var(--acc);font-weight:600}#menu hr{border:0;border-top:1px solid rgba(128,128,128,.25);margin:4px 0}
main{position:relative;flex:1;overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;opacity:var(--do);pointer-events:none}
#log{position:absolute;inset:0;overflow-y:auto;padding:10px 8px;display:flex;flex-direction:column;gap:5px}
.m{position:relative;align-self:flex-start;max-width:82%;margin:0 8px;padding:6px 9px 4px;border-radius:10px;background:var(--inn);box-shadow:0 1px .5px rgba(11,20,26,.18);word-wrap:break-word}
.m.me{align-self:flex-end;background:var(--out)}
.m.tail::before{content:"";position:absolute;top:0;width:10px;height:13px;background:inherit}
.m.tail:not(.me){border-top-left-radius:0}.m.tail:not(.me)::before{left:-8px;clip-path:polygon(100% 0,0 0,100% 100%)}
.m.tail.me{border-top-right-radius:0}.m.tail.me::before{right:-8px;clip-path:polygon(0 0,100% 0,0 100%)}
.ft{display:flex;justify-content:flex-end;align-items:center;gap:3px;font-size:11px;color:var(--mut);margin-top:2px}
.tk{width:17px;height:17px;color:#8aa0aa}.tk.rd{color:#34b7f1}
.m.img{padding:3px}.m.img img{display:block;max-width:100%;border-radius:8px}.m.img .ft{padding:0 5px 2px}
.sys,.day{align-self:center;font-size:12.5px;text-align:center;border-radius:8px;padding:5px 12px;box-shadow:0 1px .5px rgba(11,20,26,.15)}
.day{background:var(--inn);color:var(--mut);text-transform:uppercase;font-size:11.5px}.sys{background:#fff3c4;color:#54470f;max-width:88%}
.au{display:flex;align-items:center;gap:8px;min-width:220px}.pl{width:40px;height:40px;border-radius:50%;border:0;background:var(--acc);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.wf{flex:1;height:28px;display:flex;align-items:center;gap:2px}.wf i{flex:1;background:rgba(128,140,148,.5);border-radius:2px;min-height:3px}.wf i.on{background:var(--acc)}.du{font-size:12px;color:var(--mut);min-width:32px}
canvas{display:block;width:100%;max-width:300px;border-radius:8px;margin:4px 0}.m a{color:var(--acc);font-weight:600}
#att{left:10px;bottom:68px;display:flex;gap:18px;padding:16px 20px}
#att button{background:none;border:0;color:var(--tx);font:12px system-ui;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
#att button span{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff}
footer{position:relative;display:flex;align-items:flex-end;gap:7px;padding:6px 8px 8px;background:transparent}
.pill{flex:1;min-width:0;display:flex;align-items:center;background:var(--pill);border-radius:26px;padding:2px 4px;box-shadow:0 1px 2px rgba(0,0,0,.18);min-height:48px}
.pill .ib{color:var(--mut)}.pill .ib:active{background:rgba(128,128,128,.2)}
#txt{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--tx);font:inherit;font-size:16px;padding:10px 4px}
#rb{flex:1;display:none;align-items:center;gap:10px;padding:0 14px;color:var(--mut)}#rb b{width:11px;height:11px;border-radius:50%;background:#e5393f;animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
.rec #rb{display:flex}.rec #txt,.rec .pill .ib{display:none}
#act{width:50px;height:50px;border-radius:50%;border:0;color:#fff;cursor:pointer;display:grid;place-items:center;background:linear-gradient(145deg,#1fd1bd,#0c8f83);box-shadow:0 3px 8px rgba(0,0,0,.3);touch-action:none;user-select:none;transition:transform .15s}
#act.snd .mic,#act:not(.snd) .sd{display:none}.rec #act{transform:scale(1.25);background:#e5393f}
dialog{border:0;border-radius:16px;background:var(--pop);color:var(--tx);max-width:420px;width:92%;box-shadow:0 10px 40px rgba(0,0,0,.4)}dialog li{margin:7px 0}dialog button{font:inherit;padding:8px 14px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer;margin:4px 4px 0 0}
</style>
</head>

<script>
const $=s=>document.querySelector(s),log=$('#log'),ic=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
let mode='auto',watchId=null,locMsg=null,lastMine=null;
const tr=()=>mode==='net'?(navigator.onLine?'net':'off'):mode==='bt'?'bt':(navigator.onLine?'net':'bt');
function refresh(){const t=tr();$('#sub').textContent=t==='net'?'en línea · vía Internet':t==='bt'?'malla Bluetooth · 2 vecinos (simulado)':'sin conexión';
 document.querySelectorAll('#menu [data-m]').forEach(b=>b.classList.toggle('sel',b.dataset.m===mode))}
const hm=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const fmt=s=>Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0');
const lab=t=>t==='net'?'🌐':t==='bt'?'📶 '+(1+Math.floor(Math.random()*3))+' saltos':'⚠️';
const txt=s=>{const p=document.createElement('div');p.textContent=s;return p};
function sys(t,c='sys'){const d=document.createElement('div');d.className=c;d.textContent=t;log.append(d);log.scrollTop=log.scrollHeight}
function add(me,node,t,x='',cls=''){
 const d=document.createElement('div');d.className='m tail'+(me?' me':'')+cls;d.append(node);
 const f=document.createElement('div');f.className='ft';f.innerHTML=`<span>${x}${lab(t)} ${hm()}</span>`+(me?ic('ticks').replace('class="i"','class="i tk"'):'');
 d.append(f);log.append(d);log.scrollTop=log.scrollHeight;if(me)lastMine=d;return d}
function reply(t,what){if(t==='off')return;const mine=lastMine;$('#sub').textContent='escribiendo…';
 setTimeout(()=>{refresh();add(false,txt('Recibí tu '+what+' ✔'),t);mine&&mine.querySelector('.tk')&&mine.querySelector('.tk').classList.add('rd')},t==='bt'?1600:800)}

addEventListener('online',()=>{refresh();sys('Volvió Internet: se usa la red global.')});
addEventListener('offline',()=>{refresh();sys('Sin Internet: se usa la malla Bluetooth.')});
document.querySelectorAll('#menu [data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;refresh();$('#menu').hidden=true});
$('#menuB').onclick=e=>{e.stopPropagation();$('#att').hidden=true;$('#menu').hidden=!$('#menu').hidden};
$('#clip').onclick=e=>{e.stopPropagation();$('#menu').hidden=true;$('#att').hidden=!$('#att').hidden};
document.addEventListener('click',()=>{$('#menu').hidden=$('#att').hidden=true});

const inp=$('#txt'),act=$('#act');
inp.oninput=()=>act.classList.toggle('snd',!!inp.value.trim());
function sendTxt(){const v=inp.value.trim();if(!v)return;const t=tr();if(t==='off'){sys('No hay ruta: cambia el modo a Auto o Bluetooth.');return}
 add(true,txt(v),t);inp.value='';act.classList.remove('snd');reply(t,'mensaje')}
inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();sendTxt()}};

/* Imagen */
const file=$('#file');
function pick(cam){cam?file.setAttribute('capture','environment'):file.removeAttribute('capture');file.click()}
$('#cam').onclick=()=>pick(true);
file.onchange=e=>{const f=e.target.files[0];if(!f)return;const t=tr();if(t==='off'){sys('No hay ruta disponible.');return}
 const max=t==='bt'?360:900,q=t==='bt'?.5:.8,img=new Image(),url=URL.createObjectURL(f);
 img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',q),kb=Math.round(data.length*.75/1024);
  const el=new Image();el.src=data;el.alt='Imagen enviada';add(true,el,t,kb+' KB'+(t==='bt'?' · '+Math.ceil(kb*1024/180)+' frag. · ':' · '),' img');URL.revokeObjectURL(url);reply(t,'imagen')};
 img.src=url;file.value=''};

/* Audio */
let rec,chunks,t0,tmr,stream,sx,canc=false;
function audioNode(url,dur){const d=document.createElement('div');d.className='au';
 d.innerHTML=`<button class="pl">${ic('play')}</button><div class="wf">${Array.from({length:26},()=>`<i style="height:${20+Math.random()*80}%"></i>`).join('')}</div><span class="du">${fmt(dur)}</span>`;
 const a=new Audio(url),b=d.querySelector('.pl'),bs=[...d.querySelectorAll('i')];
 b.onclick=()=>{if(a.paused){a.play();b.innerHTML=ic('pause')}else{a.pause();b.innerHTML=ic('play')}};
 a.ontimeupdate=()=>{const D=isFinite(a.duration)?a.duration:dur,n=Math.floor(bs.length*a.currentTime/(D||1));bs.forEach((x,i)=>x.classList.toggle('on',i<n))};
 a.onended=()=>{b.innerHTML=ic('play');bs.forEach(x=>x.classList.remove('on'))};return d}
async function startRec(){
 try{stream=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(stream)}catch(e){sys('No se pudo usar el micrófono: '+(e.message||e));return}
 chunks=[];canc=false;rec.ondataavailable=e=>chunks.push(e.data);
 rec.onstop=()=>{stream.getTracks().forEach(x=>x.stop());const dur=(Date.now()-t0)/1000;if(canc)return;if(dur<1){sys('Mantén presionado el micrófono para grabar');return}
  const t=tr();if(t==='off'){sys('No hay ruta disponible.');return}const blob=new Blob(chunks,{type:rec.mimeType}),kb=Math.round(blob.size/1024);
  add(true,audioNode(URL.createObjectURL(blob),dur),t,kb+' KB'+(t==='bt'?' · '+Math.ceil(blob.size/180)+' frag. · ':' · '));reply(t,'nota de voz')};
 rec.start();t0=Date.now();$('#ft').classList.add('rec');$('#rt').textContent='0:00';tmr=setInterval(()=>$('#rt').textContent=fmt((Date.now()-t0)/1000),250)}
function stopRec(){clearInterval(tmr);$('#ft').classList.remove('rec');$('#rb small').textContent='‹ desliza para cancelar';if(rec&&rec.state==='recording')rec.stop()}
act.onpointerdown=e=>{if(inp.value.trim()){sendTxt();return}act.setPointerCapture(e.pointerId);sx=e.clientX;startRec()};
act.onpointermove=e=>{if(rec&&rec.state==='recording'&&e.clientX<sx-90){canc=true;$('#rb small').textContent='Suelta para cancelar'}};
act.onpointerup=act.onpointercancel=stopRec;

/* Ubicación en vivo */
function drawMap(cv,la,lo){const x=cv.getContext('2d'),w=cv.width=300,h=cv.height=150,cs=getComputedStyle(document.documentElement);
 x.fillStyle=cs.getPropertyValue('--bg');x.fillRect(0,0,w,h);x.strokeStyle='rgba(18,168,154,.35)';
 for(let i=0;i<=12;i++){x.beginPath();x.moveTo(i*w/12,0);x.lineTo(i*w/12,h);x.stroke()}
 for(let j=0;j<=6;j++){x.beginPath();x.moveTo(0,j*h/6);x.lineTo(w,j*h/6);x.stroke()}
 const px=(lo+180)/360*w,py=(90-la)/180*h;x.fillStyle='#e5393f';x.beginPath();x.arc(px,py,6,0,7);x.fill();x.strokeStyle='#e5393f';x.beginPath();x.arc(px,py,13,0,7);x.stroke()}
function locUpdate(p){const {latitude:la,longitude:lo,accuracy:ac}=p.coords,t=tr();
 if(!locMsg){const box=document.createElement('div'),tx=document.createElement('div'),cv=document.createElement('canvas'),a=document.createElement('a');
  a.target='_blank';a.rel='noopener';a.textContent='Abrir en OpenStreetMap';box.append(tx,cv,a);box._p={tx,cv,a};locMsg=add(true,box,t,'📍 en vivo · ');locMsg._b=box}
 const {tx,cv,a}=locMsg._b._p;tx.textContent='📍 '+la.toFixed(5)+', '+lo.toFixed(5)+' (±'+Math.round(ac)+' m)';
 a.href='https://www.openstreetmap.org/?mlat='+la+'&mlon='+lo+'#map=16/'+la+'/'+lo;drawMap(cv,la,lo)}
function toggleLoc(){const b=$('#loc');
 if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;locMsg=null;b.classList.remove('on');sys('Ubicación en vivo detenida.');return}
 if(!navigator.geolocation){sys('Este navegador no tiene geolocalización.');return}if(tr()==='off'){sys('No hay ruta para compartir ubicación.');return}
 watchId=navigator.geolocation.watchPosition(locUpdate,err=>{sys('No se pudo obtener la ubicación: '+err.message);navigator.geolocation.clearWatch(watchId);watchId=null;locMsg=null;b.classList.remove('on')},{enableHighAccuracy:true,maximumAge:2000});
 b.classList.add('on');sys('Ubicación en vivo activada.')}
$('#loc').onclick=toggleLoc;
document.querySelectorAll('#att [data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;a==='loc'?toggleLoc():pick(a==='cam')});

/* Prueba */
$('#test').onclick=async()=>{const r=$('#res');r.innerHTML='';const add2=(ok,t)=>{const li=document.createElement('li');li.textContent=(ok?'✅ ':'❌ ')+t;r.append(li)};
 $('#menu').hidden=true;$('#dlg').showModal();add2(navigator.onLine,'Internet: '+(navigator.onLine?'conectado':'sin conexión'));
 add2(!!navigator.geolocation,'Geolocalización disponible');add2(!!(navigator.mediaDevices&&window.MediaRecorder),'Micrófono / notas de voz disponibles');
 try{if(navigator.permissions){const p=await navigator.permissions.query({name:'geolocation'});add2(p.state!=='denied','Permiso de ubicación: '+p.state)}}catch(e){}
 const bt=!!navigator.bluetooth;add2(bt,'Web Bluetooth: '+(bt?'disponible (solo escaneo)':'no disponible en este navegador'));
 if(bt){const b=document.createElement('button');b.textContent='Buscar dispositivo';b.onclick=async()=>{try{const d=await navigator.bluetooth.requestDevice({acceptAllDevices:true});add2(true,'Dispositivo: '+(d.name||d.id))}catch(e){add2(false,'Búsqueda: '+e.message)}};r.append(b)}
 add2(false,'Malla BLE real con saltos: requiere app nativa (aquí es simulada)')};
$('#close').onclick=()=>$('#dlg').close();

refresh();sys('Hoy','day');
sys('Prototipo: el «vecino» es simulado. Mantén presionado el micrófono para grabar una nota de voz.');
add(false,txt('¡Hola! Soy un nodo cercano 👋 Prueba texto, imagen, voz o ubicación.'),tr());
</script>
